name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy config.py Data_Extraction.py Data_Train_HMM.py Dynamic_asset_allocation.py Data_Visualisation.py sensitivity_analysis.py main.py
      - run: pytest
